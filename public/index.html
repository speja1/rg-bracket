<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roland-Garros 2026 — Bracket Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --clay:#B84030;--clay-d:#7a2318;--clay-l:#d4705a;--clay-p:#f5e4de;--clay-ghost:#fdf0ec;
  --court:#1e5c21;--court-l:#267029;--court-pale:#e6f4e7;--court-mid:#4caf50;
  --sand:#EDE0CC;--sand-l:#FAF5EE;--sand-d:#c4a87c;--sand-m:#e0d0b8;
  --cream:#F8F2E8;--ink:#160c06;--ink-m:#5a3a2a;--ink-l:#9a7a6a;--gold:#9a7020;
  --white:#ffffff;
  --r:16px;--r-sm:10px;--r-pill:999px;
  --sh:0 2px 16px rgba(22,12,6,.07);--sh-md:0 6px 28px rgba(22,12,6,.11);--sh-lg:0 12px 56px rgba(22,12,6,.16);
  --sh-warm:0 4px 24px rgba(184,64,48,.15);
  --ease:cubic-bezier(.25,.46,.45,.94);--spring:cubic-bezier(.34,1.56,.64,1);
  --font-d:'Playfair Display',Georgia,serif;--font-b:'DM Sans',-apple-system,sans-serif;--font-m:'DM Mono','SF Mono',monospace;
}
body{font-family:var(--font-b);background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:300;height:60px;
  background:linear-gradient(135deg,var(--clay) 0%,#c4503e 50%,var(--clay-d) 100%);
  display:flex;align-items:center;justify-content:space-between;padding:0 2rem;
  box-shadow:0 4px 24px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.08) inset}
.hdr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-55deg,transparent,transparent 18px,rgba(255,255,255,.025) 18px,rgba(255,255,255,.025) 19px)}
/* Subtle curved bottom edge via box-shadow */
.hdr::before{content:'';position:absolute;bottom:-8px;left:0;right:0;height:16px;
  background:var(--clay-d);border-radius:0 0 50% 50%/0 0 100% 100%;
  transform:scaleX(1.02);opacity:.15;pointer-events:none}
.hdr-brand{position:relative}
.hdr-eyebrow{font-size:8px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:600;margin-bottom:2px}
.hdr-title{font-family:var(--font-d);font-size:18px;font-weight:700;color:#fff;font-style:italic;line-height:1;
  text-shadow:0 1px 8px rgba(0,0,0,.2)}
.hdr-right{display:flex;align-items:center;gap:12px;position:relative}
.user-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-pill);padding:6px 16px 6px 12px;font-size:12px;cursor:pointer;
  color:#fff;display:flex;align-items:center;gap:7px;font-weight:500;
  transition:.22s;backdrop-filter:blur(8px)}
.user-chip:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.user-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}

/* ── NAV TABS ── */
.nav{position:fixed;top:60px;left:0;right:0;z-index:299;height:40px;
  background:var(--clay-d);border-bottom:1px solid rgba(0,0,0,.18);display:none;align-items:stretch}
.nav.visible{display:flex}
.nav-inner{display:flex;align-items:stretch;overflow-x:auto;gap:2px;padding:0 6px}
.tab{padding:0 1.2rem;font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  cursor:pointer;color:rgba(255,255,255,.38);border-bottom:2px solid transparent;
  transition:.18s;white-space:nowrap;display:flex;align-items:center;border-radius:6px 6px 0 0}
.tab.active{color:#fff;border-bottom-color:rgba(255,255,255,.85);background:rgba(255,255,255,.06)}
.tab:hover:not(.active){color:rgba(255,255,255,.72);background:rgba(255,255,255,.04)}

#root{margin-top:100px;min-height:calc(100vh - 100px)}
#root.has-ticker-1{margin-top:172px}
#root.has-ticker-2{margin-top:244px}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--sand-d);border-top-color:var(--clay);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--ink-l)}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(14px);
  background:linear-gradient(135deg,var(--ink) 0%,#2a1810 100%);color:#fff;
  padding:12px 26px;border-radius:var(--r-pill);font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .3s var(--spring);z-index:9999;white-space:nowrap;
  box-shadow:0 8px 32px rgba(22,12,6,.35),0 1px 0 rgba(255,255,255,.08) inset}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── AUTH ── */
.auth-wrap{min-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;
  padding:2rem;background:radial-gradient(ellipse at 25% 15%,#f0ddd0 0%,var(--cream) 55%)}
.auth-card{width:100%;max-width:420px;background:var(--white);
  border-radius:24px;overflow:hidden;box-shadow:var(--sh-lg)}
.auth-hero{background:linear-gradient(150deg,var(--clay) 0%,#a03828 60%,var(--clay-d) 100%);
  padding:2.75rem 2rem 3.5rem;position:relative;overflow:hidden}
/* organic wave bottom */
.auth-hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:40px;
  background:var(--white);border-radius:50% 50% 0 0/60% 60% 0 0}
.auth-hero::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-50deg,transparent,transparent 20px,rgba(255,255,255,.03) 20px,rgba(255,255,255,.03) 21px)}
/* decorative blob */
.auth-hero-blob{position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  background:rgba(255,255,255,.06);border-radius:60% 40% 70% 30%/50% 60% 40% 50%;
  pointer-events:none}
.auth-inner{position:relative;z-index:1}
.auth-label{font-size:8px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.42);font-weight:700;margin-bottom:12px}
.auth-h{font-family:var(--font-d);font-size:40px;font-weight:900;color:#fff;line-height:.95;margin-bottom:10px}
.auth-h em{font-style:italic;opacity:.7}
.auth-sub{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7}
.auth-body{padding:2rem 2rem 1.75rem}
.auth-note{font-size:13px;color:var(--ink-m);line-height:1.75;margin-bottom:1.5rem}

/* ── BUTTONS ── */
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px;border:1.5px solid var(--sand-d);border-radius:var(--r-pill);
  background:var(--white);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;
  transition:.22s;margin-bottom:1rem;box-shadow:var(--sh)}
.google-btn:hover{background:var(--sand-l);border-color:var(--clay);transform:translateY(-2px);box-shadow:var(--sh-md)}
.divider{display:flex;align-items:center;gap:12px;margin:.85rem 0;font-size:11px;color:var(--ink-l)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--sand-d)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-m);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--sand-d);
  border-radius:var(--r-sm);font-size:14px;background:var(--sand-l);color:var(--ink);
  outline:none;font-family:var(--font-b);transition:.2s}
.field input:focus{border-color:var(--clay);background:var(--white);box-shadow:0 0 0 3px rgba(184,64,48,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 22px;border:1.5px solid var(--sand-d);border-radius:var(--r-pill);
  font-size:12px;font-weight:600;cursor:pointer;background:var(--white);color:var(--ink);
  transition:.2s;white-space:nowrap;font-family:var(--font-b)}
.btn:hover:not(:disabled){background:var(--sand-l);transform:translateY(-1px);box-shadow:var(--sh)}
.btn.primary{background:linear-gradient(135deg,var(--clay) 0%,#a83828 100%);color:#fff;border-color:transparent;box-shadow:var(--sh-warm)}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#c44535 0%,var(--clay-d) 100%);transform:translateY(-1px);box-shadow:0 6px 24px rgba(184,64,48,.3)}
.btn.full{width:100%}
.btn.sm{padding:7px 16px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-m)}
.btn.ghost:hover{background:var(--sand-l);border-color:var(--sand-d)}
.admin-sep{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--sand)}
/* ── BRACKET CHROME ── */
.bkt-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:.7rem 1.5rem;background:var(--white);border-bottom:1px solid var(--sand);
  gap:1rem;flex-wrap:wrap;position:sticky;top:100px;z-index:190;
  box-shadow:0 2px 12px rgba(22,12,6,.05)}
.bkt-user{font-family:var(--font-d);font-size:20px;font-weight:700;font-style:italic;color:var(--ink)}
.bkt-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score-pill{background:var(--clay-ghost);border:1px solid var(--clay-p);
  border-radius:var(--r-pill);padding:5px 14px;font-size:11px;font-weight:700;color:var(--clay-d)}
.score-pill.ok{background:var(--court-pale);border-color:#b4ddb4;color:var(--court)}
.score-pill.grey{background:var(--sand);border-color:var(--sand-d);color:var(--ink-m)}
.viewing-bar{padding:.5rem 1.5rem;background:var(--sand);border-bottom:2px solid var(--clay);font-size:12px;color:var(--ink-m);display:flex;align-items:center;gap:1rem}
.legend-bar{display:flex;align-items:center;gap:1rem;padding:.5rem 1.5rem;
  background:var(--sand-l);border-bottom:1px solid var(--sand);flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-m)}
.leg-sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.live-badge{background:#dcfce7;border:1px solid #86efac;border-radius:var(--r-pill);
  padding:3px 10px;font-size:10px;font-weight:700;color:#15803d;display:flex;align-items:center;gap:4px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#16a34a;animation:lp 1.5s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.2}}
.sync-note{font-size:11px;color:var(--ink-l)}

/* ── STEPPER ── */
.stepper{display:flex;align-items:center;overflow-x:auto;padding:.6rem 1.5rem;
  background:var(--white);border-bottom:1px solid var(--sand);
  position:sticky;top:100px;z-index:191;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.step{display:flex;align-items:center;flex-shrink:0}
.step-btn{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:.35rem .9rem;border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;color:var(--ink-l);transition:.2s;font-family:var(--font-b)}
.step-pip{width:24px;height:24px;border-radius:50%;background:var(--sand);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  color:var(--ink-l);transition:.2s;box-shadow:0 1px 4px rgba(22,12,6,.08)}
.step-lbl{font-size:8px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.step-btn.done{color:var(--court)}.step-btn.done .step-pip{background:var(--court);color:#fff;box-shadow:0 2px 8px rgba(30,92,33,.25)}
.step-btn.active{color:var(--clay);border-bottom-color:var(--clay)}
.step-btn.active .step-pip{background:var(--clay);color:#fff;box-shadow:0 2px 8px rgba(184,64,48,.3)}
.step-arr{color:var(--sand-d);font-size:11px;padding:0 3px;flex-shrink:0}

/* ── TWO COLUMNS (bracket — unchanged geometry) ── */
.bkt-viewport{overflow:hidden;position:relative}
.bkt-screen{display:flex;width:100%;min-height:60vh}
.col-wrap{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--sand)}
.col-wrap:last-child{border-right:none}
.col-header{padding:1rem 1.35rem .75rem;background:var(--sand-l);border-bottom:1px solid var(--sand)}
.col-rnd-label{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--clay);margin-bottom:4px}
.col-rnd-title{font-family:var(--font-d);font-size:26px;font-weight:900;color:var(--ink);line-height:1}
.col-rnd-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pts-badge{background:var(--clay);color:#fff;border-radius:var(--r-pill);padding:3px 11px;font-size:10px;font-weight:700}
.picks-note{font-size:12px;color:var(--ink-l)}
.col-matches{flex:1;padding:.9rem;display:flex;flex-direction:column;gap:.75rem}
.col-right{justify-content:space-around}
.bkt-screen.three-col{display:flex;width:100%}
.col-wrap.col-mid{flex:1;min-width:0;border-right:1px solid var(--sand)}
.col-gutter{width:52px;flex-shrink:0;position:relative;background:linear-gradient(90deg,var(--sand-l),var(--sand-l));border-left:1px solid var(--sand-m);border-right:1px solid var(--sand-m)}
.col-gutter svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* ── MATCH CARD (bracket — keep geometry) ── */
.mc{background:var(--white);border:1.5px solid var(--sand);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.mc.picked{border-color:rgba(184,64,48,.35)}
.mc.has-live{border-color:#fde68a}
.mc-strip{padding:.5rem .9rem;background:var(--sand-l);border-bottom:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between}
.h2h-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sand-d);color:var(--ink-l);background:var(--white);cursor:pointer;transition:.15s;text-decoration:none;flex-shrink:0}
.h2h-btn:hover{background:var(--clay);border-color:var(--clay);color:#fff;transform:scale(1.1)}
.mc-num{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-l)}
.mc-status{font-size:10px;font-weight:600;color:var(--ink-l)}
.mc-status.live{color:#16a34a}.mc-status.done{color:var(--court)}
.mc-players{display:flex;flex-direction:column}
.mc-player{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;cursor:pointer;
  transition:background .12s;user-select:none;min-height:62px}
.mc-player:first-of-type{border-bottom:1px solid var(--sand)}
.mc-player.tbd{cursor:default;opacity:.5}
.mc-player.locked{cursor:default}
.mc-player:hover:not(.locked):not(.tbd){background:var(--clay-ghost)}
.mc-player.winner{background:var(--court);color:#fff}
.mc-player.winner:first-of-type{border-bottom-color:var(--court-l)}
.mc-player.winner:hover{background:var(--court-l)}
.mc-player.my-pick{background:var(--clay-ghost);border-left:3px solid var(--clay)}
.mc-player.correct{background:var(--court-pale);border-left:3px solid var(--court)}
.mc-player.wrong{background:#fff1f1;border-left:3px solid #fca5a5}
.mc-player.live-p{border-left:3px solid #f59e0b}

/* Seed is now INLINE after the name, not a separate column */
.mc-seed{display:none} /* hidden — seed shown inline in name instead */
.mc-name{flex:1;font-size:16px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.mc-name-seed{font-size:12px;font-weight:600;color:var(--ink-l);flex-shrink:0}
.mc-player.winner .mc-name{color:#fff;font-weight:600}
.mc-player.winner .mc-name-seed{color:rgba(255,255,255,.55)}
.mc-player.my-pick .mc-name{color:var(--clay-d);font-weight:600}
.mc-player.correct .mc-name{color:var(--court);font-weight:600}
.mc-player.wrong .mc-name{color:#b91c1c;text-decoration:line-through}
.mc-player.tbd .mc-name{font-style:italic;color:var(--ink-l)}

/* Scores: larger, bolder, fixed-width columns per set */
.mc-score{font-family:var(--font-m);font-size:17px;font-weight:700;color:var(--ink-m);
  white-space:nowrap;flex-shrink:0;width:auto;min-width:0;
  text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.mc-score-set{display:inline-block;width:24px;text-align:center;line-height:1;
  font-variant-numeric:tabular-nums}
.mc-player.winner .mc-score{color:rgba(255,255,255,.92);font-weight:700}
.mc-player.wrong .mc-score,.mc-player.correct .mc-score{color:inherit}
.mc-score-empty{width:0;min-width:0;flex-shrink:0}

/* Winner checkmark: simple green ✓ text, not a circle badge */
.mc-icon{flex-shrink:0;font-size:15px;font-weight:700;width:20px;text-align:center;
  border-radius:0;background:none;display:flex;align-items:center;justify-content:center}
.mc-icon.chk{color:var(--clay);background:none}
.mc-icon.ok{color:#4ade80;background:none}
.mc-icon.x{color:#ef4444;background:none}
.mc-player.winner .mc-icon.ok{color:rgba(255,255,255,.7)}

.srv{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex-shrink:0;animation:sp 1.2s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.2}}
.mc-time{padding:.45rem 1rem;background:var(--sand-l);border-top:1px solid var(--sand);font-size:11px;color:var(--ink-l);display:flex;align-items:center;gap:5px}
.mc.bye .mc-player.winner{opacity:.82}
.mc-bye-row{padding:.8rem 1rem;background:var(--sand-l);border-top:1px solid var(--sand);font-size:12px;font-style:italic;color:var(--ink-l);opacity:.45}

/* Flag: slightly larger */
.mc-flag{font-size:18px;line-height:1;flex-shrink:0;width:24px;text-align:center}

/* Later rounds scale up */
.col-lg .mc-name{font-size:17px}
.col-lg .mc-player{padding:.8rem 1.1rem;min-height:70px}
.col-lg .mc-score{font-size:18px}
.col-lg .mc-score-set{width:26px}
.col-xl .mc-name{font-size:19px}
.col-xl .mc-player{padding:.9rem 1.2rem;min-height:78px}
.col-xl .mc-score{font-size:20px}
.col-xl .mc-score-set{width:28px}

/* ── BOTTOM NAV ── */
.bkt-nav{position:sticky;bottom:0;z-index:200;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--sand);
  box-shadow:0 -6px 24px rgba(22,12,6,.08);padding:.9rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem}
.nav-progress{display:flex;flex-direction:column;align-items:center;gap:5px}
.nav-prog-text{font-size:11px;color:var(--ink-l)}
.nav-prog-bar{width:160px;height:5px;background:var(--sand);border-radius:var(--r-pill);overflow:hidden}
.nav-prog-fill{height:100%;background:linear-gradient(90deg,var(--clay-l),var(--clay));border-radius:var(--r-pill);transition:width .4s}
.nav-btn{display:flex;align-items:center;gap:8px;padding:11px 22px;
  border:1.5px solid var(--sand-d);border-radius:var(--r-pill);font-size:13px;font-weight:600;
  cursor:pointer;background:var(--white);color:var(--ink);transition:.2s;font-family:var(--font-b)}
.nav-btn:hover:not(:disabled){background:var(--sand-l);transform:translateY(-1px);box-shadow:var(--sh)}
.nav-btn:disabled{opacity:.35;cursor:default;transform:none}
.nav-btn.primary{background:linear-gradient(135deg,var(--clay) 0%,#a83828 100%);
  color:#fff;border-color:transparent;padding:12px 28px;font-size:14px;box-shadow:var(--sh-warm)}
.nav-btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#c44535 0%,var(--clay-d) 100%);box-shadow:0 6px 24px rgba(184,64,48,.3)}
.nav-btn-inner{display:flex;flex-direction:column;gap:1px}
.nav-btn-sub{font-size:10px;opacity:.65;font-weight:400}

/* ── LEADERBOARD ── */
.lb-page{max-width:820px;margin:0 auto;padding:2rem}
.lb-table{background:var(--white);border:1.5px solid var(--sand);
  border-radius:20px;overflow:hidden;box-shadow:var(--sh-md)}
.lb-exp{font-size:13px;color:var(--ink-l);text-align:right}
.lb-win{font-size:13px;font-weight:700;color:var(--ink-m);text-align:right}

function buildDisplay(){
  // Build seed lookup: name → seed number
  const seedMap={};
  ATP_R1.forEach(m=>{
    if(m.p1?.s)seedMap[m.p1.n]=m.p1.s;
    if(m.p2?.s)seedMap[m.p2.n]=m.p2.s;
  });
  S.rounds=buildTree(ATP_R1);
  for(let p=0;p<12;p++){
    S.rounds.forEach((rnd,ri)=>rnd.matches.forEach((m,mi)=>{
      const byeW=m.p2?.n==='BYE'?m.p1?.n:m.p1?.n==='BYE'?m.p2?.n:null;
      const w=byeW||S.live[m.id]?.winner;
      if(!w||w==='BYE')return;
      const nx=S.rounds[ri+1]?.matches[Math.floor(mi/2)];
      if(nx){if(mi%2===0)nx.p1={n:w,s:seedMap[w]||null};else nx.p2={n:w,s:seedMap[w]||null};}
    }));
  }
  // Use viewed user's picks if viewing someone else's bracket
  const activePicks=S.viewingUid?(S.all.find(b=>b.id===S.viewingUid)?.picks||{}):S.picks;
  for(let p=0;p<8;p++){
    S.rounds.forEach((rnd,ri)=>rnd.matches.forEach((m,mi)=>{
      const pick=activePicks[m.id];
      if(!pick||S.live[m.id]?.winner)return;
      const nx=S.rounds[ri+1]?.matches[Math.floor(mi/2)];
      if(!nx||S.live[nx.id]?.winner)return;
      if(mi%2===0){if(nx.p1.n==='TBD')nx.p1={n:pick,s:seedMap[pick]||null};}
      else{if(nx.p2.n==='TBD')nx.p2={n:pick,s:seedMap[pick]||null};}
    }));
  }
  // Pass 3: mark dead picks — user picked someone who lost, show in next round slot
  S.rounds.forEach((rnd,ri)=>rnd.matches.forEach((m,mi)=>{
    const pick=activePicks[m.id];
    const winner=S.live[m.id]?.winner;
    const completed=!!(S.live[m.id]?.completed||S.live[m.id]?.state==='post');
    if(!pick||!completed||!winner||pick===winner)return; // only wrong picks
    const nx=S.rounds[ri+1]?.matches[Math.floor(mi/2)];
    if(!nx)return;
    // Store dead pick alongside the real winner
    if(mi%2===0)nx.deadPick1={n:pick,s:seedMap[pick]||null};
    else nx.deadPick2={n:pick,s:seedMap[pick]||null};
  }));
}
function buildTree(r1){
  const rounds=[{key:ROUNDS[0],matches:r1.map(m=>({...m,p1:{...m.p1},p2:{...m.p2}}))}];
  let prev=rounds[0].matches,ri=1;
  while(prev.length>1){
    const next=[];
    for(let i=0;i<prev.length;i+=2){
      const espnIdx=i*Math.pow(2,ri-1);
      next.push({id:`g${ri}_${espnIdx}`,p1:{n:'TBD',s:null},p2:{n:'TBD',s:null}});
    }
    rounds.push({key:ROUNDS[ri]||`R${ri+1}`,matches:next});
    prev=next;ri++;
  }
  return rounds;
}
function fmtSets(sets){
  if(!sets?.length)return '';
  const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup=n=>String(n).split('').map(d=>SUP[d]||d).join('');
  return sets.map(({mine,opp,tb})=>{
    const s=tb==null?String(mine):mine>opp?String(mine):`${mine}${sup(tb)}`;
    return `<span class="mc-score-set">${s}</span>`;
  }).join('');
}
function calcScore(picks){
  // pts: points earned so far
  // correct: correct picks out of played non-bye matches
  // played: total non-bye matches that have completed
  // total: total picks made (for reference)
  // maxPossible: current pts + points from picks where player is still alive
  let pts=0,correct=0,played=0,total=0,maxPossible=0;

  // Build set of eliminated players (lost a completed non-bye match)
  const eliminated=new Set();
  S.rounds.forEach(rnd=>rnd.matches.forEach(m=>{
    const lv=S.live[m.id];
    const isBye=m.p2?.n==='BYE'||m.p1?.n==='BYE';
    if(isBye)return;
    if(lv?.completed&&lv?.winner){
      // The loser is eliminated
      const loser=lv.p1===lv.winner?lv.p2:lv.p1;
      if(loser)eliminated.add(loser);
    }
  }));

  S.rounds.forEach(rnd=>rnd.matches.forEach(m=>{
    const lv=S.live[m.id];
    const isBye=m.p2?.n==='BYE'||m.p1?.n==='BYE';
    if(isBye)return; // never count byes

    const pick=picks?.[m.id];
    const winner=lv?.winner;
    const completed=!!(lv?.completed||lv?.state==='post');
    const pts_rnd=RND_PTS[rnd.key]||1;

    // Count completed matches for the denominator
    if(completed) played++;

    if(pick){
      total++;
      if(winner&&pick===winner){
        correct++;
        pts+=pts_rnd;
        maxPossible+=pts_rnd; // already scored
      } else if(winner&&pick!==winner){
        // wrong — pick is dead, no max possible from this
      } else if(!completed){
        // match not played yet — check if picked player is still alive
        if(!eliminated.has(pick)){
          maxPossible+=pts_rnd; // still possible
        }
        // if eliminated, this pick is dead — 0 added to max
      }
    }
  }));

  // pts already scored is the floor of maxPossible
  maxPossible+=pts; // wait — pts is already counted above in the winner branch
  // Actually need to restructure: maxPossible should be pts (earned) + potential (still alive picks)
  // Let me recalculate cleanly:
  let potential=0;
  S.rounds.forEach(rnd=>rnd.matches.forEach(m=>{
    const lv=S.live[m.id];
    const isBye=m.p2?.n==='BYE'||m.p1?.n==='BYE';
    if(isBye)return;
    const pick=picks?.[m.id];
    const winner=lv?.winner;
    const completed=!!(lv?.completed||lv?.state==='post');
    const pts_rnd=RND_PTS[rnd.key]||1;
    if(pick&&!completed&&!winner){
      if(!eliminated.has(pick)) potential+=pts_rnd;
    }
  }));

  return{pts,correct,played,total,maxPossible:pts+potential};
}
function picksInRound(ri){
  const rnd=S.rounds[ri];if(!rnd)return{done:0,total:0};
  const pickable=rnd.matches.filter(m=>!(m.p2?.n==='BYE'||m.p1?.n==='BYE')&&!(m.p1?.n==='TBD'&&m.p2?.n==='TBD'));
  const done=pickable.filter(m=>S.picks[m.id]||S.live[m.id]?.winner).length;
  return{done,total:pickable.length};
}

async function loadLive(){
  const doc=await fs.get('meta',`live_${TOURNAMENT_ID}`);
  if(!doc?.matches)return false;
  try{
    const data=JSON.parse(doc.matches);
    const valid=Object.keys(data).filter(k=>/^(m\d+|g\d+_\d+)$/.test(k));
    if(!valid.length)return false;
    Object.assign(S.live,data);
    if(doc.locked!==undefined)S.locked=doc.locked;
    return true;
  }catch{return false;}
}
async function syncFromServer(){return await loadLive();}

async function loadOdds(){
  try{
    const doc=await fs.get('meta',`odds_${TOURNAMENT_ID}`);
    if(doc?.data)S.odds=JSON.parse(doc.data);
  }catch(e){S.odds={};}
}

function getOdds(p1name,p2name){
  if(!p1name||!p2name||!S.odds)return null;
  // Try both orderings of the key
  function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_]/g,'_');}
  const k1=[p1name,p2name].sort().join('__').replace(/[^a-zA-Z0-9_]/g,'_');
  const k2=[norm(p1name),norm(p2name)].sort().join('__');
  const entry=S.odds[k1]||S.odds[k2];
  if(!entry)return null;
  // Figure out which player is p1 in our card vs p1 in the odds entry
  function toks(s){return new Set(s.toLowerCase().replace(/[^a-z]/g,' ').split(/\s+/).filter(w=>w.length>1));}
  function nm(a,b){const ta=toks(a),tb=toks(b);for(const t of ta)if(tb.has(t))return true;return false;}
  const entryP1isOurP1=nm(entry.p1,p1name);
  return{
    p1_odds:entryP1isOurP1?entry.p1_odds:entry.p2_odds,
    p2_odds:entryP1isOurP1?entry.p2_odds:entry.p1_odds,
    p1_prob:entryP1isOurP1?entry.p1_prob:entry.p2_prob,
    p2_prob:entryP1isOurP1?entry.p2_prob:entry.p1_prob,
    book:entry.book,
  };
}

async function loadPicks(){
  if(!S.uid)return;
  const fb=await fs.get('brackets',S.uid);
  if(fb?.tournamentId===TOURNAMENT_ID){
    S.picks=fb.picks||{};
    S.bracketLocked=fb.bracketLocked||false;
    S.tiebreaker=fb.tiebreaker||null;
    return;
  }
  try{
    const ls=JSON.parse(localStorage.getItem('rg_picks_'+S.uid)||'null');
    if(ls?.tournamentId===TOURNAMENT_ID){
      S.picks=ls.picks||{};
      S.bracketLocked=ls.bracketLocked||false;
    }
  }catch{}
}
async function savePicks(quiet=false){
  if(!S.uid)return;
  const entry={name:S.userName,picks:S.picks,draw:S.draw,tournamentId:TOURNAMENT_ID,savedAt:Date.now(),uid:S.uid,bracketLocked:S.bracketLocked,tiebreaker:S.tiebreaker};
  await fs.set('brackets',S.uid,entry);
  try{localStorage.setItem('rg_picks_'+S.uid,JSON.stringify(entry));}catch{}
  const i=S.all.findIndex(b=>b.id===S.uid);

  if(!quiet)toast('Saved ✓');
}
let _st;function debounceSave(){
  clearTimeout(_st);
  _st=setTimeout(()=>{
    savePicks(true);
    S.simResults=runMonteCarloForAll();
    // Update LB if visible
    const lbRow=document.querySelector('.lb-row.me');
    if(lbRow&&S.simResults[S.uid]){
      const sr=S.simResults[S.uid];

      if(winEl)winEl.textContent=sr.winProb+'%';
      const expEl=lbRow.querySelector('.lb-exp-score');
      if(expEl)expEl.textContent=sr.expectedScore;
    }
  },1500);
}

function runMonteCarloForAll(){
  if(!S.all||S.all.length===0) return {};
  const allPicks={};
  S.all.filter(b=>b.tournamentId===TOURNAMENT_ID).forEach(b=>{
    if(b.uid&&b.picks) allPicks[b.id||b.uid]=b.picks;
  });
  if(Object.keys(allPicks).length===0) return {};
  return runMonteCarlo(S.rounds, allPicks, S.live, S.odds);
}

async function onReady(){
  updateChip();showLoading('Loading bracket…');
  await Promise.all([loadPicks(),fs.all('brackets').then(a=>{S.all=a;}),loadLive(),loadOdds()]);
  buildDisplay();
  // Run Monte Carlo simulation
  S.simResults = runMonteCarloForAll();
  showApp();
  async function poll(){
    const live=Object.values(S.live).some(m=>m.live);
    if(live)await syncFromServer();else await loadLive();
    buildDisplay();
    S.simResults=runMonteCarloForAll();
    if(S.tab==='bracket')renderBracket();
    if(S.tab==='lb')renderLB();
    setTimeout(poll,live?30000:3*60*1000);
  }
  setTimeout(poll,Object.values(S.live).some(m=>m.live)?30000:3*60*1000);
  setInterval(async()=>{S.all=await fs.all('brackets')||[];if(S.tab==='lb')renderLB();},2*60*1000);
}

      try{const g=JSON.parse(localStorage.getItem('rg_guest')||'null');if(g?.uid&&g?.name){S.isGuest=true;S.uid=g.uid;S.userName=g.name;await onReady();return;}}catch{}

// ── SEEDED RNG — mulberry32
function mulberry32(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

// Build deterministic seed from current live results
function buildSeed(live){
  let h=0;
  const keys=Object.keys(live||{}).sort();
  for(const k of keys){
    const w=live[k]?.winner||'';
    for(let i=0;i<w.length;i++){
      h=Math.imul(31,h)+w.charCodeAt(i)|0;
    }
  }
  return h||42;
}

function eloWinProb(nameA, nameB, oddsOverride){
  // If we have real bookmaker odds for this matchup, use them (more accurate)
  if(oddsOverride){
    // Already normalized to 0-1
    return oddsOverride;
  }
  const eloA = CLAY_ELO[nameA] || 1900;
  const eloB = CLAY_ELO[nameB] || 1900;
  return 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
}

function normalizeOdds(americanA, americanB){
  // Convert American odds to normalized win probability
  function implied(american){
    const n = Number(american);
    return n > 0 ? 100/(n+100) : -n/(-n+100);
  }
  if(!americanA || !americanB) return null;
  const rawA = implied(americanA);
  const rawB = implied(americanB);
  const total = rawA + rawB;
  return rawA / total; // normalized p(A wins)
}

// ── MONTE CARLO SIMULATION ────────────────────────────────────────────────
const N_SIMS = 1000;
// RND_PTS defined in global scope

function runMonteCarlo(rounds, allPicks, live, oddsData){
  // allPicks: {uid: {matchId: playerName}}
  // live: {matchId: {winner, completed}}
  // oddsData: {key: {p1, p2, p1_odds, p2_odds}}
  // Returns: {uid: {expectedScore, winProb, simScores[]}}

  const uids = Object.keys(allPicks);
  const results = {};
  uids.forEach(uid => results[uid] = {totalScore:0, wins:0, simScores:[]});

  // Build odds lookup
  function getOddsProb(p1name, p2name){
    if(!oddsData) return null;
    function norm(s){return s.replace(/[^a-zA-Z]/g,'_');}
    const keys = [[p1name,p2name].sort().join('__').replace(/[^a-zA-Z0-9_]/g,'_')];
    for(const k of keys){
      const e = oddsData[k];
      if(!e) continue;
      // Figure orientation
      function toks(s){return new Set(s.toLowerCase().replace(/[^a-z]/g,' ').split(/\s+/).filter(w=>w.length>1));}
      function nm(a,b){const ta=toks(a),tb=toks(b);for(const t of ta)if(tb.has(t))return true;return false;}
      const p1isA = nm(e.p1, p1name);
      const p1odds = p1isA ? e.p1_odds : e.p2_odds;
      const p2odds = p1isA ? e.p2_odds : e.p1_odds;
      const prob = normalizeOdds(p1odds, p2odds);
      if(prob !== null) return prob;
    }
    return null;
  }

  const seed = buildSeed(live);
  const rng = mulberry32(seed);

  for(let sim = 0; sim < N_SIMS; sim++){
    // Simulate the full tournament
    // Build a fresh tree each simulation
    const simWinners = {}; // matchId → simulated winner name

    // Process rounds in order
    rounds.forEach((rnd, ri) => {
      rnd.matches.forEach((m, mi) => {
        const matchId = m.id;
        const lv = live[matchId] || {};

        // If match is already completed, winner is known
        if(lv.winner){
          simWinners[matchId] = lv.winner;
          return;
        }

        // Determine the two players (may come from previous sim results)
        let p1name = m.p1?.n;
        let p2name = m.p2?.n;

        // If players are TBD, look up from previous round sim
        if(p1name === 'TBD' || !p1name){
          const prevMatch = rounds[ri-1]?.matches[mi*2];
          if(prevMatch) p1name = simWinners[prevMatch.id] || prevMatch.p1?.n;
        }
        if(p2name === 'TBD' || !p2name){
          const prevMatch = rounds[ri-1]?.matches[mi*2+1];
          if(prevMatch) p2name = simWinners[prevMatch.id] || prevMatch.p2?.n;
        }

        // Skip if we can't determine players
        if(!p1name || !p2name || p1name === 'TBD' || p2name === 'TBD' ||
           p1name === 'BYE' || p2name === 'BYE'){
          simWinners[matchId] = p1name || p2name;
          return;
        }

        // Get win probability for p1
        const oddsProb = getOddsProb(p1name, p2name);
        const prob = oddsProb !== null ? oddsProb : eloWinProb(p1name, p2name, null);

        // Simulate: random number < prob → p1 wins
        simWinners[matchId] = rng() < prob ? p1name : p2name;
      });
    });

    // Score each user's bracket against this simulation
    let maxScore = 0;
    const userScores = {};
    uids.forEach(uid => {
      let score = 0;
      rounds.forEach(rnd => {
        const pts = RND_PTS[rnd.key] || 1;
        rnd.matches.forEach(m => {
          const pick = allPicks[uid]?.[m.id];
          const simWinner = simWinners[m.id];
          if(pick && simWinner && pick === simWinner) score += pts;
        });
      });
      userScores[uid] = score;
      if(score > maxScore) maxScore = score;
    });

    // Tally results
    uids.forEach(uid => {
      const score = userScores[uid];
      results[uid].totalScore += score;
      results[uid].simScores.push(score);
      if(score === maxScore && maxScore > 0) results[uid].wins++;
    });
  }

  // Compute final stats
  uids.forEach(uid => {
    const r = results[uid];
    r.expectedScore = Math.round(r.totalScore / N_SIMS * 10) / 10;
    r.winProb = Math.round(r.wins / N_SIMS * 1000) / 10; // percent with 1dp
    // Score distribution for fun
    const scores = r.simScores.sort((a,b)=>a-b);
    r.p10 = scores[Math.floor(N_SIMS * 0.1)];
    r.p50 = scores[Math.floor(N_SIMS * 0.5)];
    r.p90 = scores[Math.floor(N_SIMS * 0.9)];
    delete r.simScores; // don't need raw scores in state
    delete r.totalScore;
    delete r.wins;
  });

  return results;
}

// Get matches for a round filtered to a quadrant's slice
// For rounds 0-3 (R128/R64/R32/R16), each quadrant owns 1/4 of matches
// For rounds 4-6 (QF/SF/F), all quadrants see all matches (no filter)
function getQuadrantMatches(rndIdx, quadrant){
  const rnd=S.rounds[rndIdx];
  if(!rnd) return [];
  if(!quadrant) return rnd.matches;
  const totalMatches=rnd.matches.length;
  // R128=64, R64=32, R32=16, R16=8 → each quadrant gets 1/4
  // QF=4, SF=2, F=1 → no quadrant filter
  if(rndIdx>=4) return rnd.matches; // QF/SF/F: all matches visible
  const q=quadrant.matches; // [startR1Idx, endR1Idx] in R1 (0-based)
  // Scale to this round: each successive round halves
  const factor=Math.pow(2,rndIdx); // R64=2x, R32=4x, R16=8x
  // Actually go from R1 range: q[0]/factor to (q[1]+1)/factor
  const startR1=q[0]; const endR1=q[1];
  const start=Math.floor(startR1/factor);
  const end=Math.floor(endR1/factor);
  return rnd.matches.slice(start,end+1);
}

function renderColumnFiltered(rndIdx,vp,side,quadrant){
  const rnd=S.rounds[rndIdx];
  if(!rnd)return '';
  const filteredMatches=getQuadrantMatches(rndIdx,quadrant);
  if(!filteredMatches.length)return '';
  const sz=['','','col-lg','col-lg','col-xl','col-xl','col-xl'][rndIdx]||'';
  const rightStyle=side==='right'||side==='mid'?'display:flex;flex-direction:column;justify-content:space-around;':'';
  const filteredDone=filteredMatches.filter(m=>!(m.p2?.n==='BYE'||m.p1?.n==='BYE')&&(vp[m.id]||S.live[m.id]?.winner)).length;
  const filteredTotal=filteredMatches.filter(m=>!(m.p2?.n==='BYE'||m.p1?.n==='BYE')&&!(m.p1?.n==='TBD'&&m.p2?.n==='TBD')).length;

  let h=`<div class="col-wrap ${sz}" id="col-${side}-${rndIdx}">
    <div class="col-header">
      <div class="col-rnd-label">Round ${rndIdx+1} of ${ROUNDS.length}</div>
      <div class="col-rnd-title">${RND_LABEL[rnd.key]}</div>
      <div class="col-rnd-meta">
        <span class="pts-badge">${RND_PTS[rnd.key]} pt${RND_PTS[rnd.key]>1?'s':''}/pick</span>
        ${filteredTotal>0?`<span class="picks-note">${filteredDone}/${filteredTotal} picks</span>`:''}
      </div>
    </div>
    <div class="col-matches" id="matches-${side}-${rndIdx}" style="${rightStyle}">`;
  filteredMatches.forEach((m,mi)=>{h+=renderCard(m,mi,rnd.key,vp,side,rndIdx);});
  h+=`</div></div>`;
  return h;
}

function renderColumn(rndIdx,vp,side){return renderColumnFiltered(rndIdx,vp,side,null);}

function renderCard(m,mi,roundKey,vp,side,rndIdx){
  const lv=S.live[m.id]||{};
  const isBye=m.p2?.n==='BYE'||m.p1?.n==='BYE';
  const byeW=isBye?(m.p1?.n!=='BYE'?m.p1?.n:m.p2?.n):null;
  const done=isBye||!!(lv.winner||lv.completed||lv.state==='post');
  const effW=byeW||lv.winner;
  const isLiveM=lv.live&&!done;
  const isSched=lv.scheduled&&!done&&!lv.live;
  const myPick=vp[m.id];

  let cls=`mc${isBye?' bye':''}${myPick?' picked':''}${isLiveM?' has-live':''}`;
  let h=`<div class="${cls}" id="mc-${m.id}">`;

  const statusTxt=isLiveM?'<span class="mc-status live">● Live</span>':done&&!isBye?'<span class="mc-status done">✓</span>':'';
  const label=isBye?'BYE':`Match ${mi+1}`;
  // H2H button — only when both players are known
  const p1known=m.p1?.n&&m.p1.n!=='TBD'&&m.p1.n!=='BYE'&&m.p1.n!=='Qualifier';
  const p2known=m.p2?.n&&m.p2.n!=='TBD'&&m.p2.n!=='BYE'&&m.p2.n!=='Qualifier';
  const h2hLink=(!isBye&&p1known&&p2known)?h2hUrl(m.p1.n,m.p2.n):null;
  const p1esc=m.p1?.n?.replace(/'/g,"\\'");
  const p2esc=m.p2?.n?.replace(/'/g,"\\'");
  const h2hBtn=(!isBye&&p1known&&p2known)?`<button class="h2h-btn" title="Head to Head record" onclick="event.stopPropagation();openH2H('${p1esc}','${p2esc}')">
    <svg width="13" height="13" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.8"/>
      <text x="10" y="14.5" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" font-family="Georgia,serif" font-style="italic">i</text>
    </svg>
  </button>`:'';
  h+=`<div class="mc-strip"><div class="mc-num">${label}</div><div style="display:flex;align-items:center;gap:6px">${statusTxt}${getCourtLabel(m.id)?`<span class="mc-court">${getCourtLabel(m.id)}</span>`:''}${h2hBtn}</div></div>`;
  h+=`<div class="mc-players">`;

  if(isBye){
    const seed=m.p1?.n!=='BYE'?m.p1:m.p2;
    const bPhotoUrl=seed?.n?getPhoto(seed.n):null;
    const bPhotoEl=bPhotoUrl?`<img class="mc-photo" src="${bPhotoUrl}" alt="${seed?.n}" onerror="this.style.display='none'">`:`<div class="mc-photo-placeholder">${getFlag(seed?.n||'')||'?'}</div>`;
    const bFlag=seed?.n?`<div class="mc-flag">${getFlag(seed.n)}</div>`:'';
    h+=`<div class="mc-player winner locked">${bPhotoEl}${bFlag}<div class="mc-name">${seed?.n}${seed?.s?`<span class="mc-name-seed">(${seed.s})</span>`:''}</div></div>`;
    h+=`<div class="mc-bye-row">BYE</div>`;
  }else{
    [m.p1,m.p2].forEach((pl,pi)=>{
      const tbd=pl.n==='TBD'||pl.n==='Qualifier';
      const isW=effW===pl.n;
      const isMy=myPick===pl.n;
      const isCorr=isMy&&done&&isW;
      const isWrong=isMy&&done&&!isW;
      const isSrv=isLiveM&&lv.serving===(pi===0?'p1':'p2');
      const sets=fmtSets(pi===0?lv.p1Sets:lv.p2Sets);
      const showSets=(done||isLiveM)&&sets;

      // Dead pick for this slot: user picked someone who lost a prior round
      // They appear in this slot (strikethrough), real winner shown in their own row
      const dp=pi===0?m.deadPick1:m.deadPick2;
      const hasDeadPick=!!(dp&&!tbd&&isW&&done);

      let rowCls='mc-player';
      if(tbd)rowCls+=' tbd locked';
      else if(hasDeadPick)rowCls+=' winner locked'; // real winner still green
      else if(isW&&done)rowCls+=' winner locked';
      else if(isCorr)rowCls+=' correct locked';
      else if(isWrong)rowCls+=' wrong locked';
      else if(isMy)rowCls+=' my-pick';
      else if(done)rowCls+=' locked';
      if(isLiveM&&!tbd)rowCls+=' live-p';

      const click=(!tbd&&!done&&!S.viewingUid)?`onclick="pick('${m.id}','${pl.n.replace(/'/g,"\\'")}')"`:'';

      const srvEl=isSrv?'<div class="srv"></div>':'';

        :`<div class="mc-photo-placeholder">${flagEl?'':getFlag(pl.n)||'?'}</div>`;
      let iconEl='';
      if(isCorr)iconEl='<div class="mc-icon ok">✓</div>';
      else if(isWrong)iconEl='<div class="mc-icon x">✗</div>';
      else if(isMy&&!done)iconEl='<div class="mc-icon chk">✓</div>';
      // Winner row with a dead pick still gets a ✓
      else if(hasDeadPick)iconEl='<div class="mc-icon ok">✓</div>';

      // Get odds for this player
      let oddsEl='';
      if(!done&&!isLiveM&&!tbd&&m.p1?.n&&m.p2?.n&&m.p1.n!=='TBD'&&m.p2.n!=='TBD'){
        const od=getOdds(m.p1.n,m.p2.n);
        if(od){
          const o=pi===0?od.p1_odds:od.p2_odds;
          const prob=pi===0?od.p1_prob:od.p2_prob;
          if(o)oddsEl=`<div class="mc-odds ${Number(o.replace('+',''))<0?'fav':'dog'}" title="${prob} implied (${od.book})">${o}</div>`;
        }
      }

      // Build right slot — fixed width, icon outside
      let rightSlot='';
      if(showSets){
        rightSlot=`<div class="mc-score">${sets}</div>`;
      } else if(done||isLiveM){
        rightSlot=`<div class="mc-score-empty"></div>`;
      } else if(oddsEl){
        rightSlot=oddsEl;
        oddsEl='';
      }

      if(hasDeadPick){
        // Show: real winner row (green) with dead pick name crossed out below it
        const dpFlag=getFlag(dp.n);
        const dpSd=dp.s?`<span class="mc-dead-seed">${dp.s}</span>`:'';
        h+=`<div class="${rowCls}" ${click}>
          ${photoEl}${flagEl}${srvEl}
          <div class="mc-name-stack">
            <div class="mc-name">${pl.n}${seedSpan}</div>
            <div class="mc-dead-line">${dpFlag} ${dpSd}${dp.n}</div>
          </div>
          ${rightSlot}${iconEl}
        </div>`;
      } else {
        h+=`<div class="${rowCls}" ${click}>${photoEl}${flagEl}${srvEl}<div class="mc-name">${tbd?'TBD':pl.n}${tbd?'':seedSpan}</div>${rightSlot}${iconEl}</div>`;
      }
    });
  }
  h+=`</div>`;
  if(isSched&&lv.scheduledTime&&lv.timeValid){
    const t=new Date(lv.scheduledTime);
    h+=`<div class="mc-time">📅 ${t.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`;
  }
  h+=`</div>`;
  return h;
}

function drawConnectorsFiltered(leftIdx,rightIdx,vp,quadrant){
  const svg=document.getElementById(`svg-${leftIdx}`);

  if(!svg||!gutter)return;
  const leftRnd=S.rounds[leftIdx];
  const rightRnd=S.rounds[rightIdx];
  if(!leftRnd||!rightRnd)return;

  const leftMatches=getQuadrantMatches(leftIdx,quadrant);
  const rightMatches=getQuadrantMatches(rightIdx,quadrant);

  svg.innerHTML='';
  const gr=gutter.getBoundingClientRect();
  const leftMatchesContainer=document.getElementById(`matches-left-${leftIdx}`);
  const rightMatchesContainer=document.getElementById(`matches-right-${rightIdx}`);
  if(!leftMatchesContainer||!rightMatchesContainer)return;

  const leftCards=leftMatches.map(m=>document.getElementById(`mc-${m.id}`));
  const lcr=leftMatchesContainer.getBoundingClientRect();
  const leftTops=leftCards.map(el=>el?el.getBoundingClientRect().top-lcr.top:0);
  const leftHeights=leftCards.map(el=>el?el.getBoundingClientRect().height:0);
  const leftMids=leftTops.map((t,i)=>t+leftHeights[i]/2);

  const lh=leftMatchesContainer.getBoundingClientRect().height;
  rightMatchesContainer.style.position='relative';
  rightMatchesContainer.style.height=lh+'px';
  rightMatchesContainer.style.justifyContent='unset';

  rightMatches.forEach((rm,ri)=>{
    const rightCard=document.getElementById(`mc-${rm.id}`);
    if(!rightCard)return;
    const aMid=leftMids[ri*2]??0;
    const bMid=leftMids[ri*2+1]??aMid;
    const targetCenterY=(aMid+bMid)/2;
    const cardH=rightCard.getBoundingClientRect().height;
    const topPos=targetCenterY-cardH/2;
    rightCard.style.position='absolute';
    rightCard.style.left='0';
    rightCard.style.right='0';
    rightCard.style.top=Math.max(0,topPos)+'px';
  });

  rightMatches.forEach((rm,ri)=>{
    const la=leftMatches[ri*2];
    const lb=leftMatches[ri*2+1];
    const rightCard=document.getElementById(`mc-${rm.id}`);
    if(!rightCard||!la)return;
    const rr=rightCard.getBoundingClientRect();
    const aMid=leftMids[ri*2]+(lcr.top-gr.top);
    const bMid=(leftMids[ri*2+1]??leftMids[ri*2])+(lcr.top-gr.top);
    const rMid=rr.top+rr.height/2-gr.top;
    const cx=gr.width/2;
    const liveA=S.live[la.id]||{};
    const liveB=lb?S.live[lb.id]||{}:{};
    const liveRM=S.live[rm.id]||{};
    const done=!!(liveRM.winner||liveRM.completed);
    const winA=liveA.winner;const winB=liveB.winner;
    function col(pick,win){if(done)return '#cfc4b8';if(win)return '#267029';if(pick)return '#B84030';return '#d8cfc4';}
    const colA=col(vp[la.id],winA);
    const colB=lb?col(vp[lb.id],winB):'#d8cfc4';
    const joinY=(aMid+bMid)/2;
    const joinCol=winA?'#267029':winB?'#267029':vp[la.id]?'#B84030':vp[lb?.id]?'#B84030':'#d8cfc4';
    line(svg,'#e8ddd0',3,0,aMid,cx,aMid);
    line(svg,'#e8ddd0',3,cx,Math.min(aMid,joinY),cx,Math.max(aMid,joinY));
    if(lb){line(svg,'#e8ddd0',3,0,bMid,cx,bMid);line(svg,'#e8ddd0',3,cx,Math.min(bMid,joinY),cx,Math.max(bMid,joinY));}
    line(svg,'#e8ddd0',3,cx,joinY,gr.width,rMid);
    line(svg,colA,2,0,aMid,cx,aMid);line(svg,colA,2,cx,aMid,cx,joinY);
    if(lb){line(svg,colB,2,0,bMid,cx,bMid);line(svg,colB,2,cx,bMid,cx,joinY);}
    line(svg,joinCol,2,cx,joinY,gr.width,rMid);
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',String(cx));dot.setAttribute('cy',String(joinY));
    dot.setAttribute('r','3.5');dot.setAttribute('fill',joinCol);
    svg.appendChild(dot);
  });
}

// ── MINIMAP NAVIGATOR ────────────────────────────────────────────────────────
function renderMinimap(){
  // Remove old minimap if any
  const old=document.getElementById('minimap-nav');
  if(old)old.remove();

  const qsi=Math.min(S.quadrantRndIdx,2);
  // Don't show minimap on final screen (QF/SF/F shows all)
  if(qsi===2)return;

  const nav=document.createElement('div');
  nav.id='minimap-nav';
  nav.style.cssText=`position:fixed;bottom:90px;right:18px;z-index:500;
    background:var(--white);border:1.5px solid var(--sand-d);border-radius:14px;
    box-shadow:var(--sh-lg);padding:10px;display:flex;flex-direction:column;gap:6px;
    width:130px;cursor:pointer;user-select:none`;

  const label=document.createElement('div');
  label.style.cssText='font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-l);text-align:center;margin-bottom:2px';
  label.textContent='BRACKET VIEW';
  nav.appendChild(label);

  // Mini bracket grid: 2x2 quadrants
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:5px';

  const quadLayout=[
    {key:'Q1',label:'Q1',pos:'TL',sf:'SF1 ↑'},
    {key:'Q3',label:'Q3',pos:'TR',sf:'SF2 ↑'},
    {key:'Q2',label:'Q2',pos:'BL',sf:'SF1 ↓'},
    {key:'Q4',label:'Q4',pos:'BR',sf:'SF2 ↓'},
  ];

  quadLayout.forEach(({key,label,pos,sf})=>{
    const cell=document.createElement('div');
    const isActive=S.quadrant===key;
    // Count picks in this quadrant
    const vp=S.viewingUid?(S.all.find(b=>b.id===S.viewingUid)?.picks||{}):S.picks;
    const q=QUADRANTS[key];
    const qMatches=getQuadrantMatches(0,q); // R128 matches for this quadrant
    const picked=qMatches.filter(m=>vp[m.id]).length;
    const total=qMatches.filter(m=>!(m.p2?.n==='BYE'||m.p1?.n==='BYE')).length;
    const pct=total>0?Math.round(picked/total*100):0;

    cell.style.cssText=`border-radius:8px;padding:6px 5px;text-align:center;cursor:pointer;transition:.15s;
      border:${isActive?'2px solid var(--clay)':'1.5px solid var(--sand-d)'};
      background:${isActive?'var(--clay-ghost)':'var(--sand-l)'}`;
    cell.innerHTML=`<div style="font-size:9px;font-weight:800;color:${isActive?'var(--clay-d)':'var(--ink-m)'}">${label}</div>
      <div style="font-size:7px;color:var(--ink-l);margin:1px 0">${pos}</div>
      <div style="height:3px;border-radius:2px;background:var(--sand);margin:3px 0;overflow:hidden">
        <div style="height:100%;background:${isActive?'var(--clay)':'var(--court)'};width:${pct}%;border-radius:2px;transition:width .3s"></div>
      </div>
      <div style="font-size:7px;color:var(--ink-l)">${picked}/${total}</div>`;
    cell.onclick=()=>{S.quadrant=key;renderBracket();};
    grid.appendChild(cell);
  });
  nav.appendChild(grid);

  // SF/F hint
  const hint=document.createElement('div');
  hint.style.cssText='font-size:7.5px;color:var(--ink-l);text-align:center;border-top:1px solid var(--sand);padding-top:5px;line-height:1.4';
  hint.innerHTML='Q1+Q2 → <strong>SF1</strong><br>Q3+Q4 → <strong>SF2</strong><br><span style="opacity:.7">Tap a quadrant to view</span>';
  nav.appendChild(hint);

  document.body.appendChild(nav);
}

// Quadrant navigation
function nextQRnd(){
  if(S.quadrantRndIdx>=2)return;
  debounceSave();
  animateTransition(1,()=>{S.quadrantRndIdx++;renderBracket();});
}
function prevQRnd(){
  if(S.quadrantRndIdx<=0)return;
  debounceSave();
  animateTransition(-1,()=>{S.quadrantRndIdx--;renderBracket();});
}
function jumpToQRnd(idx){
  if(idx===S.quadrantRndIdx)return;
  const d=idx>S.quadrantRndIdx?1:-1;
  debounceSave();
  animateTransition(d,()=>{S.quadrantRndIdx=idx;renderBracket();});
}

// ── BRACKET CONNECTOR DRAWING (original, used for QF/SF/F full view) ──────────
function drawConnectors(leftIdx,rightIdx,vp){
  const svg=document.getElementById(`svg-${leftIdx}`);
  const gutter=document.getElementById(`gutter-${leftIdx}`);
  const rightCol=document.getElementById(`col-right-${rightIdx}`);
  if(!svg||!gutter)return;
  const leftRnd=S.rounds[leftIdx];
  const rightRnd=S.rounds[rightIdx];
  if(!leftRnd||!rightRnd)return;

  svg.innerHTML='';
  const gr=gutter.getBoundingClientRect();
  const leftMatchesContainer=document.getElementById(`matches-left-${leftIdx}`);
  const rightMatchesContainer=document.getElementById(`matches-right-${rightIdx}`);
  if(!leftMatchesContainer||!rightMatchesContainer)return;

  // MATHEMATICAL positioning: measure each left card height, sum them up
  // to get exact midpoints — don't rely on getBoundingClientRect for right cards
  const leftCards=leftRnd.matches.map(m=>document.getElementById(`mc-${m.id}`));
  const lcr=leftMatchesContainer.getBoundingClientRect();
  
  // Measure each left card's actual top and height from DOM
  const leftTops=leftCards.map(el=>el?el.getBoundingClientRect().top-lcr.top:0);
  const leftHeights=leftCards.map(el=>el?el.getBoundingClientRect().height:0);
  const leftMids=leftTops.map((t,i)=>t+leftHeights[i]/2);

  // Position right column
  const lh=leftMatchesContainer.getBoundingClientRect().height;
  rightMatchesContainer.style.position='relative';
  rightMatchesContainer.style.height=lh+'px';
  rightMatchesContainer.style.justifyContent='unset';

  rightRnd.matches.forEach((rm,ri)=>{
    const rightCard=document.getElementById(`mc-${rm.id}`);
    if(!rightCard)return;
    // The two left feeders for this right card are at indices ri*2 and ri*2+1
    const aMid=leftMids[ri*2]??0;
    const bMid=leftMids[ri*2+1]??0;
    const targetCenterY=(aMid+bMid)/2;
    const cardH=rightCard.getBoundingClientRect().height;
    const topPos=targetCenterY-cardH/2;
    rightCard.style.position='absolute';
    rightCard.style.left='0';
    rightCard.style.right='0';
    rightCard.style.top=Math.max(0,topPos)+'px';
  });

  // Draw SVG lines
  rightRnd.matches.forEach((rm,ri)=>{
    const la=leftRnd.matches[ri*2];
    const lb=leftRnd.matches[ri*2+1];
    const rightCard=document.getElementById(`mc-${rm.id}`);
    if(!rightCard||!la)return;

    const rr=rightCard.getBoundingClientRect();
    const aMid=leftMids[ri*2]+(lcr.top-gr.top);
    const bMid=(leftMids[ri*2+1]??leftMids[ri*2])+(lcr.top-gr.top);
    const rMid=rr.top+rr.height/2-gr.top;
    const cx=gr.width/2;

    const liveA=S.live[la.id]||{};
    const liveB=S.live[lb.id]||{};
    const liveRM=S.live[rm.id]||{};
    const done=!!(liveRM.winner||liveRM.completed);
    const winA=liveA.winner;const winB=liveB.winner;

    function col(pick,win){
      if(done)return '#cfc4b8';
      if(win)return '#267029';
      if(pick)return '#B84030';
      return '#d8cfc4';
    }
    const colA=col(vp[la.id],winA);
    const colB=col(vp[lb.id],winB);
    const joinY=(aMid+bMid)/2;
    const joinCol=winA?'#267029':winB?'#267029':vp[la.id]?'#B84030':vp[lb.id]?'#B84030':'#d8cfc4';

    // Background lines (slightly thicker, lighter)
    line(svg,'#e8ddd0',3,0,aMid,cx,aMid);
    line(svg,'#e8ddd0',3,cx,Math.min(aMid,joinY),cx,Math.max(aMid,joinY));
    line(svg,'#e8ddd0',3,0,bMid,cx,bMid);
    line(svg,'#e8ddd0',3,cx,Math.min(bMid,joinY),cx,Math.max(bMid,joinY));
    line(svg,'#e8ddd0',3,cx,joinY,gr.width,rMid);
    // Colored lines on top
    line(svg,colA,2,0,aMid,cx,aMid);
    line(svg,colA,2,cx,aMid,cx,joinY);
    line(svg,colB,2,0,bMid,cx,bMid);
    line(svg,colB,2,cx,bMid,cx,joinY);
    line(svg,joinCol,2,cx,joinY,gr.width,rMid);
    // Join dot
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',String(cx));dot.setAttribute('cy',String(joinY));
    dot.setAttribute('r','3.5');dot.setAttribute('fill',joinCol);
    svg.appendChild(dot);
  });
}
function line(svg,stroke,w,x1,y1,x2,y2){
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',w);l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

function animateTransition(dir,cb){
  const vp=document.getElementById('bkt-viewport');
  if(!vp){cb();return;}
  vp.style.transition='opacity .18s ease,transform .18s ease';
  vp.style.opacity='0';
  vp.style.transform=`translateX(${dir<0?'30px':'-30px'})`;
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>{
      const vp2=document.getElementById('bkt-viewport');
      if(vp2){
        vp2.style.transition='none';vp2.style.opacity='0';vp2.style.transform=`translateX(${dir<0?'-30px':'30px'})`;
        requestAnimationFrame(()=>{
          vp2.style.transition='opacity .3s ease,transform .3s cubic-bezier(.25,.46,.45,.94)';
          vp2.style.opacity='1';vp2.style.transform='translateX(0)';
          window.scrollTo({top:100,behavior:'smooth'});
          // Redraw connectors after animation settles
          setTimeout(()=>{
            const si=Math.min(S.screenIdx,SCREENS.length-1);
            const[li,ri]=SCREENS[si];
            const vp2=S.viewingUid?(S.all.find(b=>b.id===S.viewingUid)?.picks||{}):S.picks;
            drawConnectors(li,ri,vp2);
          },320);
        });
      }
    });
  },200);
}

function pick(mid,name){
  if(S.viewingUid){toast("Viewing someone else's bracket");return;}
  if(S.locked){toast('Picks are locked');return;}
  if(S.bracketLocked){toast('Your bracket is locked — you already submitted!');return;}
  if(S.picks[mid]===name)delete S.picks[mid];else S.picks[mid]=name;
  buildDisplay();
  // Fast re-render using quadrant-aware state
  const qsi=Math.min(S.quadrantRndIdx,2);
  const quadScreens=[[0,1],[2,3],[4,5]];
  const[leftIdx,rightIdx]=quadScreens[qsi];
  const vp=S.picks;
  const leftRnd=S.rounds[leftIdx];const rightRnd=S.rounds[rightIdx];
  const lc=document.getElementById(`matches-left-${leftIdx}`);
  const rc=document.getElementById(`matches-right-${rightIdx}`);
  const q=qsi===2?null:QUADRANTS[S.quadrant];
  const leftMatches=getQuadrantMatches(leftIdx,q);
  const rightMatches=getQuadrantMatches(rightIdx,q);
  if(lc)lc.innerHTML=leftMatches.map((m,mi)=>renderCard(m,mi,leftRnd.key,vp,'left',leftIdx)).join('');
  if(rc)rc.innerHTML=rightMatches.map((m,mi)=>renderCard(m,mi,rightRnd.key,vp,'right',rightIdx)).join('');
  const np=document.querySelector('.nav-prog-text');
  if(np){
    const allPickable=S.rounds.reduce((acc,rnd)=>acc+rnd.matches.filter(m=>!(m.p2?.n==='BYE'||m.p1?.n==='BYE')&&!(m.p1?.n==='TBD'&&m.p2?.n==='TBD')).length,0);
    const allPicked=Object.keys(S.picks).length;
    np.textContent=`${allPicked}/${allPickable} total picks`;
  }
  if(qsi===2)drawConnectors(leftIdx,rightIdx,vp);
  else drawConnectorsFiltered(leftIdx,rightIdx,vp,q);
  renderMinimap();
  debounceSave();
}

function lockAndSave(){
  // Count total pickable matches
  const totalPickable=S.rounds.reduce((acc,rnd)=>acc+rnd.matches.filter(m=>
    !(m.p2?.n==='BYE'||m.p1?.n==='BYE')&&!(m.p1?.n==='TBD'&&m.p2?.n==='TBD')
  ).length,0);
  const totalPicked=Object.keys(S.picks).length;
  if(totalPicked<totalPickable){
    // Partial bracket — just save without locking
    savePicks();
    toast('Bracket saved! Finish all picks to submit and lock.');
    return;
  }
  // Full bracket — lock and save
  S.bracketLocked=true;
  savePicks();
  toast('🏆 Bracket submitted and locked!');
  renderBracket(); // refresh to show locked state
}

// ── LIVE TICKER ───────────────────────────────────────────────────────────────
function jumpToMatch(matchId){
  // Find which round and quadrant this match is in, navigate there
  let foundRndIdx=-1,foundQuadrant=null;
  S.rounds.forEach((rnd,ri)=>{
    rnd.matches.forEach(m=>{
      if(m.id===matchId){
        foundRndIdx=ri;
        // Determine quadrant from match index in R1
        if(ri<=3){
          const r1matches=S.rounds[0].matches;
          const factor=Math.pow(2,ri);
          const r1idx=S.rounds[ri].matches.indexOf(m)*factor;
          if(r1idx<16)foundQuadrant='Q1';
          else if(r1idx<32)foundQuadrant='Q2';
          else if(r1idx<48)foundQuadrant='Q3';
          else foundQuadrant='Q4';
        }
      }
    });
  });
  if(foundRndIdx<0)return;
  // Map round index to quadrant screen index
  const qsi=foundRndIdx<=1?0:foundRndIdx<=3?1:2;
  S.quadrantRndIdx=qsi;
  if(foundQuadrant)S.quadrant=foundQuadrant;
  setTab('bracket');
  // Scroll to the match card after render
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const el=document.getElementById(`mc-${matchId}`);
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    },100);
  });
}

function renderTicker(){
  const old=document.getElementById('ticker-wrap');
  if(old)old.remove();
  document.getElementById('root')?.classList.remove('has-ticker-1','has-ticker-2');

  const shortName=n=>{
    if(!n)return'?';
    const p=n.trim().split(/\s+/);
    return p.length>1?p[0][0]+'. '+p[p.length-1]:n;
  };

  // Collect live and finished, attach match IDs
  // live matches always shown first; finished limited to 10 most recent
  const liveItems=[];
  const finItems=[];
  S.rounds.forEach(rnd=>{
    rnd.matches.forEach(m=>{
      const lv=S.live[m.id]||{};
      // Use full names from live data if available, else fall back to draw names
      const p1=lv.p1||m.p1?.n||'?';
      const p2=lv.p2||m.p2?.n||'?';
      if(lv.live&&!(lv.completed||lv.state==='post')){
        liveItems.push({id:m.id,p1,p2,lv});
      } else if(lv.winner){
        finItems.push({id:m.id,p1,p2,lv});
      }
    });
  });

  if(!liveItems.length&&!finItems.length)return;

  // Full name from draw data — strip trailing initial abbreviation artifacts
  // e.g. "Humbert U." stays as-is since that's what we have
  const fullName=n=>n||'?';

  // 10 most recent finished (last in array = most recently stored)
  const finShow=finItems.slice(-10).reverse();

  function liveCard(m){
    const f1=getFlag(m.p1),f2=getFlag(m.p2);
    const lv=m.lv;
    const sets1=(lv.p1Sets||[]).map(s=>s.mine);
    const sets2=(lv.p2Sets||[]).map(s=>s.mine);
    const scoreStr1=sets1.join(' ')||'0';
    const scoreStr2=sets2.join(' ')||'0';
    const srv1=lv.serving==='p1'?'<span class="tk-srv"></span>':'';
    const srv2=lv.serving==='p2'?'<span class="tk-srv"></span>':'';
    return `<div class="ticker-card live-card" onclick="jumpToMatch('${m.id}')">
      <div class="ticker-card-player">
        <span class="tk-flag">${f1}</span>${srv1}
        <span class="tk-name">${fullName(m.p1)}</span>
        <span class="tk-score">${scoreStr1}</span>
      </div>
      <div class="ticker-card-player">
        <span class="tk-flag">${f2}</span>${srv2}
        <span class="tk-name">${fullName(m.p2)}</span>
        <span class="tk-score">${scoreStr2}</span>
      </div>
    </div>`;
  }

  function finCard(m){
    const lv=m.lv;
    const winner=lv.winner;
    const loser=winner===m.p1?m.p2:m.p1;
    const wFlag=getFlag(winner),lFlag=getFlag(loser);
    // Scores: winner's sets are whichever player won
    const wIsP1=winner===m.p1;
    const wSets=(wIsP1?lv.p1Sets:lv.p2Sets||[]);
    const lSets=(wIsP1?lv.p2Sets:lv.p1Sets||[]);
    const wScore=(wSets||[]).map(s=>s.mine).join(' ');
    const lScore=(lSets||[]).map(s=>s.mine).join(' ');
    return `<div class="ticker-card" onclick="jumpToMatch('${m.id}')">
      <div class="ticker-card-player">
        <span class="tk-flag">${wFlag}</span>
        <span class="tk-name winner">${fullName(winner)}</span>
        ${wScore?`<span class="tk-score">${wScore}</span>`:'<span class="tk-check">✓</span>'}
      </div>
      <div class="ticker-card-player">
        <span class="tk-flag">${lFlag}</span>
        <span class="tk-name loser">${fullName(loser)}</span>
        ${lScore?`<span class="tk-score" style="color:#555">${lScore}</span>`:''}
      </div>
    </div>`;
  }

  let rowCount=0;
  let html='';

  if(liveItems.length){
    rowCount++;
    html+=`<div class="ticker-row">
      <div class="ticker-row-label live-lbl">
        <span class="tk-dot"></span>
        <span class="tk-section-name">Live</span>
      </div>
      <div class="ticker-cards">${liveItems.map(liveCard).join('')}</div>
    </div>`;
  }
  if(finShow.length){
    rowCount++;
    html+=`<div class="ticker-row${liveItems.length?' ticker-section':''}">
      <div class="ticker-row-label fin-lbl">
        <span class="tk-section-name">Results</span>
      </div>
      <div class="ticker-cards">${finShow.map(finCard).join('')}</div>
    </div>`;
  }

  const wrap=document.createElement('div');
  wrap.id='ticker-wrap';
  wrap.className='ticker-wrap';
  wrap.innerHTML=html;
  document.body.appendChild(wrap);

  const root=document.getElementById('root');
  if(root){
    const cls=rowCount===2?'has-ticker-2':'has-ticker-1';
    root.classList.add(cls);
    root.style.marginTop=(100+rowCount*72)+'px';
  }
}

function openTiebreaker(){
  let ov=document.getElementById('tb-overlay');
  if(!ov){
    ov=document.createElement('div');
    ov.id='tb-overlay';ov.className='tb-overlay';
    ov.innerHTML=`<div class="tb-modal">
      <div class="tb-hero"><div class="tb-hero-inner">
        <div class="tb-eyebrow">Tiebreaker</div>
        <div class="tb-title">Total games<br>in the Final</div>
        <div class="tb-sub">Used only if players tie on points.<br>Closest guess wins.</div>
      </div></div>
      <div class="tb-body">
        <p class="tb-explainer">Guess the <strong>total number of games played</strong> in the Championship match. For example, a 6-4, 6-3, 6-2 final = 21 total games. A 7-5, 3-6, 7-6, 6-4 final = 31 games.</p>
        <input class="tb-input" id="tb-input" type="number" min="12" max="60" placeholder="—" value="${S.tiebreaker||''}">
        <p class="tb-hint">Range: 12 (6-0 6-0 6-0) to ~58 (7-6 6-7 6-7 7-6 7-5)</p>
        <div class="tb-actions">
          <button class="btn ghost" style="flex:1" onclick="closeTiebreaker()">Cancel</button>
          <button class="btn primary" style="flex:2" onclick="saveTiebreaker()">Save tiebreaker →</button>
        </div>
      </div>
    </div>`;
    ov.addEventListener('click',e=>{if(e.target===ov)closeTiebreaker();});
    document.body.appendChild(ov);
  }
  document.getElementById('tb-input').value=S.tiebreaker||'';
  requestAnimationFrame(()=>ov.classList.add('open'));
  document.getElementById('tb-input').focus();
}
function closeTiebreaker(){
  const ov=document.getElementById('tb-overlay');
  if(ov)ov.classList.remove('open');
}
function saveTiebreaker(){
  const v=parseInt(document.getElementById('tb-input')?.value||'',10);
  if(!v||v<12||v>60){toast('Enter a number between 12 and 60');return;}
  S.tiebreaker=v;
  savePicks(true);
  closeTiebreaker();
  toast(`Tiebreaker saved: ${v} total games ✓`);
  // Refresh bracket UI to show tiebreaker badge
  renderBracket();
}

}

function h2hDbKey(p1,p2){return[p1,p2].sort().join(' vs ');}
function h2hDbKey(p1,p2){return[p1,p2].sort().join(' vs ');}

async function fetchH2H(p1,p2){
  const key=h2hDbKey(p1,p2);
  const raw=H2H_DB[key];
  // Build H2H data (flip orientation if needed)
  let h2h;
  if(raw){
    const sorted=[p1,p2].sort();
    if(sorted[0]===p1){h2h=raw;}
    else{h2h={...raw,
      p1_wins:raw.p2_wins,p2_wins:raw.p1_wins,
      clay_p1:raw.clay_p2,clay_p2:raw.clay_p1,
      hard_p1:raw.hard_p2,hard_p2:raw.hard_p1,
      grass_p1:raw.grass_p2,grass_p2:raw.grass_p1,
      matches:(raw.matches||[]).map(m=>({...m,winner:m.winner==='p1'?'p2':'p1'})),
    };}
  } else {
    // No H2H data yet — return empty record
    h2h={p1_wins:0,p2_wins:0,total:0,clay_p1:0,clay_p2:0,hard_p1:0,hard_p2:0,
      grass_p1:0,grass_p2:0,streak:'',last_met:'',
      key_fact:'No head-to-head data available for this matchup.',matches:[]};
  }
  return {
    h2h,
    p1Profile: PLAYER_PROFILES[p1]||null,
    p2Profile: PLAYER_PROFILES[p2]||null,
  };
}

function renderH2H(modal,p1,p2,data,prof1,prof2){
  const{p1_wins=0,p2_wins=0,total=0,
    clay_p1=0,clay_p2=0,hard_p1=0,hard_p2=0,grass_p1=0,grass_p2=0,
    streak='',last_met='',key_fact='',matches=[]}=data;
  const p1Lead=p1_wins>p2_wins,tied=p1_wins===p2_wins;

  function sn(n){
    const p=n.trim().split(/\s+/);
    if(p.length<=1)return n;
    if(p[p.length-1].length<=2)return n;
    return p[0][0]+'. '+p[p.length-1];
  }
  const d1=sn(p1),d2=sn(p2);

  let h=`<div class="h2h-modal-hdr">
    <button class="h2h-close" onclick="closeH2H()">✕</button>
    <div class="h2h-vs">
      <div class="h2h-player">
        <div class="h2h-player-name">${p1}</div>
        ${last_met?`<div class="h2h-player-rank">Last met: ${last_met}</div>`:''}
      </div>
      <div class="h2h-vs-badge">vs</div>
      <div class="h2h-player"><div class="h2h-player-name">${p2}</div></div>
    </div>
  </div>
  <div class="h2h-record">
    <div class="h2h-record-side ${p1Lead?'winner':tied?'':'loser'}">
      <div class="h2h-record-wins">${p1_wins}</div>
      <div class="h2h-record-lbl">${d1}</div>
    </div>
    <div class="h2h-record-mid">
      <div class="h2h-record-total">${total} match${total!==1?'es':''}</div>
      ${streak?`<div class="h2h-record-surface">${streak}</div>`:''}
    </div>
    <div class="h2h-record-side ${!p1Lead&&!tied?'winner':tied?'':'loser'}">
      <div class="h2h-record-wins">${p2_wins}</div>
      <div class="h2h-record-lbl">${d2}</div>
    </div>
  </div>
  <div class="h2h-splits">
    <div class="h2h-split">
      <div class="h2h-split-lbl" style="color:#B84030">🟤 Clay</div>
      <div class="h2h-split-val">${clay_p1}–${clay_p2}</div>
    </div>
    <div class="h2h-split">
      <div class="h2h-split-lbl" style="color:#3d7aed">🔵 Hard</div>
      <div class="h2h-split-val">${hard_p1}–${hard_p2}</div>
    </div>
    <div class="h2h-split">
      <div class="h2h-split-lbl" style="color:#267029">🟢 Grass</div>
      <div class="h2h-split-val">${grass_p1}–${grass_p2}</div>
    </div>
  </div>`;

  // Player profile cards
  function profileCard(p,prof,side){
    if(!prof)return '';
    const flag={'ITA':'🇮🇹','GER':'🇩🇪','ESP':'🇪🇸','FRA':'🇫🇷','USA':'🇺🇸','SRB':'🇷🇸','RUS':'🇷🇺',
      'AUS':'🇦🇺','GBR':'🇬🇧','CAN':'🇨🇦','NOR':'🇳🇴','GRE':'🇬🇷','ITA':'🇮🇹','ARG':'🇦🇷',
      'BRA':'🇧🇷','POL':'🇵🇱','CZE':'🇨🇿','HUN':'🇭🇺','KAZ':'🇰🇿','BEL':'🇧🇪','CHI':'🇨🇱',
      'MON':'🇲🇨','NED':'🇳🇱','AUT':'🇦🇹','POR':'🇵🇹','GEO':'🇬🇪','CHN':'🇨🇳','PER':'🇵🇪',
      'FIN':'🇫🇮','BIH':'🇧🇦','SUI':'🇨🇭'}[prof.country]||'🏳️';
    return `<div class="h2h-profile-card">
      <div class="h2h-profile-name">${flag} ${p}</div>
      <div class="h2h-profile-grid">
        <div class="h2h-stat"><div class="h2h-stat-lbl">Rank</div><div class="h2h-stat-val">#${prof.rank}</div></div>
        <div class="h2h-stat"><div class="h2h-stat-lbl">Age</div><div class="h2h-stat-val">${prof.age}</div></div>
        <div class="h2h-stat"><div class="h2h-stat-lbl">Height</div><div class="h2h-stat-val">${prof.height}</div></div>
        <div class="h2h-stat"><div class="h2h-stat-lbl">2026 W/L</div><div class="h2h-stat-val">${prof.ytd}</div></div>
        <div class="h2h-stat"><div class="h2h-stat-lbl">Plays</div><div class="h2h-stat-val">${prof.hand}</div></div>
        <div class="h2h-stat"><div class="h2h-stat-lbl">Backhand</div><div class="h2h-stat-val">${prof.bh}</div></div>
      </div>
    </div>`;
  }
  if(prof1||prof2){
    h+=`<div class="h2h-profiles">${profileCard(p1,prof1,'left')}${profileCard(p2,prof2,'right')}</div>`;
  }
  if(key_fact)h+=`<div class="h2h-fact">${key_fact}</div>`;

  if(matches.length>0){
    h+=`<div class="h2h-matches"><div class="h2h-match-hdr">Recent matches</div>`;
    matches.forEach(m=>{
      const isP1=m.winner==='p1';
      const wCls=isP1?'p1':'p2';
      const wName=isP1?d1:d2;
      const sc=SURF_COL[m.surface]||'#888';
      h+=`<div class="h2h-match-row">
        <div class="h2h-match-date">${m.year}</div>
        <div class="h2h-match-event">
          <div class="h2h-match-tourn">${m.tournament}</div>
          <div class="h2h-match-round">${m.round}</div>
        </div>
        <div class="h2h-match-surface" style="background:${sc}" title="${m.surface}"></div>
        <div class="h2h-match-score">${m.score||''}</div>
        <div class="h2h-match-winner ${wCls}">${wName}</div>
      </div>`;
    });
    h+=`</div>`;
  }else if(total===0){
    h+=`<div style="padding:2rem;text-align:center;color:var(--ink-l);font-size:13px;font-style:italic">These players have not met on the ATP Tour.</div>`;
  }

  h+=`<div style="padding:.75rem 1.25rem;border-top:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between;gap:1rem">
    <div style="font-size:10px;color:var(--ink-l)">⚡ AI-generated · May not include most recent results</div>
    <button class="btn sm primary" onclick="closeH2H()">Close</button>
  </div>`;

  modal.innerHTML=h;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeH2H();});


init();

</script>
